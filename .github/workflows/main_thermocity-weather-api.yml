# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# O pacote publicado tem duas aplicações no mesmo Web App:
#   api/     -> ThermoCity.Weather.Api (HTTP, endpoints e autenticação)
#   worker/  -> ThermoCity.Weather.Worker (3 workers: leituras, previsões e resumo diário)
#   start.sh -> sobe o Worker em segundo plano e a API em primeiro plano

name: Build and deploy .NET app to Azure Web App - thermocity-weather-api

on:
  push:
    branches:
      - main
  pull_request:          # PR para a main: roda só o build e os testes (validação, sem deploy)
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'thermocity-weather-api-v2'
  SOLUTION: 'ThermoCity.Weather.slnx'
  API_PROJECT: 'src/ThermoCity.Weather.Api'
  WORKER_PROJECT: 'src/ThermoCity.Weather.Worker'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --output ./package/api

      - name: Publish Worker
        run: dotnet publish ${{ env.WORKER_PROJECT }} --configuration Release --output ./package/worker

      - name: Create start script
        run: |
          cat > ./package/start.sh <<'EOF'
          #!/bin/bash
          # Sobe o Worker em segundo plano (reinicia sozinho se cair) e a API em primeiro plano.
          export ASPNETCORE_URLS="http://0.0.0.0:${PORT:-8080}"
          ROOT=/home/site/wwwroot

          (
            cd "$ROOT/worker"
            while true; do
              echo "[start.sh] Iniciando o Worker..."
              dotnet ThermoCity.Weather.Worker.dll
              echo "[start.sh] Worker encerrou (código $?). Reiniciando em 15s..."
              sleep 15
            done
          ) &

          cd "$ROOT/api"
          echo "[start.sh] Iniciando a API..."
          exec dotnet ThermoCity.Weather.Api.dll
          EOF
          chmod +x ./package/start.sh

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '.'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
